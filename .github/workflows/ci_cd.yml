name: SafeRoute Saheli CI/CD Pipeline

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master ]

jobs:
  test-backend-and-ai:
    name: Backend & AI Test Suite
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'

      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libgl1 libglib2.0-0

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt

      - name: Run Hardware-in-the-Loop (HIL) Sensor Simulator
        run: |
          python firmware/tests/hil_hardware_simulator.py

      - name: Run Full Automated Test Suite (46+ Tests)
        run: |
          python -m unittest discover -s tests -p "test_*.py"

      - name: Run Ecosystem Hardware-to-Cloud Simulation
        run: |
          python backend/scripts/simulate_emergency_ecosystem.py

  test-flutter-mobile:
    name: Flutter Mobile Client Verification
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.x'
          channel: 'stable'
          cache: true

      - name: Install Flutter Dependencies
        working-directory: flutter_app
        run: flutter pub get

      - name: Run Static Analysis (0 issues policy)
        working-directory: flutter_app
        run: flutter analyze

      - name: Run Widget & Architecture Tests
        working-directory: flutter_app
        run: flutter test

  build-react-admin:
    name: React Admin Operations Center Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: admin_panel/package-lock.json

      - name: Install Node Dependencies
        working-directory: admin_panel
        run: npm ci

      - name: Build Vite Production Bundle (Pure Vanilla CSS)
        working-directory: admin_panel
        run: npm run build

  docker-compose-validate:
    name: Docker Stack Specification Audit
    runs-on: ubuntu-latest
    needs: [test-backend-and-ai, test-flutter-mobile, build-react-admin]

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Validate Docker Compose Configuration
        run: |
          docker compose config
          docker compose -f deployment/docker-compose.prod.yml config
